name: Find Adjacent Repositories

# Maintains the "Adjacent Repositories" section of README.md once a month.
# Actions are SHA-pinned and permissions are explicit so this passes the fleet's
# zizmor workflow-security audit. Checkout credentials are withheld from the
# third-party recommender; the final push receives the token directly.

on:
  schedule:
    - cron: "0 0 1 * *"  # once a month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adjacent-repositories-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recommend-repos:
    name: Update README recommendations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # Push the generated README update.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adjacent Repositories Recommender
        uses: gojiplus/adjacent@ab14392f3ccd0179ee0f8a995748b3b5485b6e36 # v1.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update adjacent repositories [automated]" || echo "No changes to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
