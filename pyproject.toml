[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "calibre"
description = "Advanced probability calibration techniques for machine learning models"
readme = "README.md"
authors = [
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "cvxpy>=1.2.0",
]
dynamic = ["version"]

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-xdist>=3.0", "ruff>=0.7.0", "pre-commit>=3.0", "pydoclint>=0.8.3", "pyright>=1.1.390"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
]
docs = [
    "sphinx>=8",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    # Required by docs/source/conf.py and not part of the canon docs group.
    "sphinx-autodoc-typehints>=1.25",
    "nbsphinx>=0.9.0",
    "ipykernel>=6.0",
    # Used by the example notebooks only. Dropped as runtime dependencies in
    # 0.7.0, which left every notebook failing at its import cell until 0.7.1.
    "matplotlib>=3.9",
    "pandas>=2.0",
]

[tool.pyright]
include = ["calibre"]
typeCheckingMode = "standard"
# cvxpy ships no type information, so its import is unresolvable to pyright even
# though it is a hard runtime dependency.
reportMissingImports = "none"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["calibre"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
[project.urls]
"Homepage" = "https://github.com/finite-sample/calibre"
"Bug Tracker" = "https://github.com/finite-sample/calibre/issues"
"Documentation" = "https://finite-sample.github.io/calibre/"
"Repository" = "https://github.com/finite-sample/calibre"


# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = [
    "D203",
    "D213",
    "B008",
    "C901",
    "E501",
    # `X` is scikit-learn's name for the feature argument of fit/transform, and the
    # numerical routines use conventional math notation for matrices (M, D, B).
    "N803",
    "N806",
]

[tool.ruff.lint.pydocstyle]
# This package documents in numpy style (see any calibrator docstring) and Sphinx
# renders it that way; google convention would flag every section header.
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# S102/S307: tests/test_readme.py executes the README's code blocks on purpose.
"tests/**" = ["S101", "S102", "D", "T201"]
# Notebooks print by design, and each cell is linted without the preceding cells in
# scope, so F821 fires on names that are defined earlier in the notebook.
# SIM102/SIM108: notebook cells favour explicit stepwise branches for readability,
# since each branch usually carries the comment explaining what it demonstrates.
"docs/**/*.ipynb" = ["D", "T201", "F821", "E402", "I001", "B905", "SIM102", "SIM108"]
"docs/**" = ["D"]

[tool.pytest.ini_options]
minversion = "7.0"
# "calibre" is here so --doctest-modules below actually reaches the library's
# docstrings; with only "tests" it would collect nothing from the package.
testpaths = ["tests", "calibre"]
python_files = "test_*.py"
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-modules",
    "--cov=calibre",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# Doctests are executable documentation, so run them: --doctest-modules above is
# what collects them. They were not collected before, which is how several
# docstrings came to state numerically wrong results. ELLIPSIS lets an example
# elide a volatile fragment with `...` rather than be left out of collection.
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]

# Coverage configuration
[tool.coverage.run]
source = ["calibre"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Deptry configuration
[tool.deptry]
pep621_dev_dependency_groups = ["docs"]

# Pydoclint configuration
[tool.pydoclint]
style = "numpy"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

